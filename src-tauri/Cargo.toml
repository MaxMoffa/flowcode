[workspace]
members = ["installer", "shared"]

[package]
name = "flowcode"
version = "0.3.0"
description = "Flowcode - cross-platform terminal"
authors = ["Massimo Moffa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `cargo tauri build`/`cargo tauri dev` pass this automatically; our release
# builds (this repo's CI and local release process) invoke plain `cargo
# build --release` instead (see .github/workflows/release.yml), which
# bypasses that. Without it, `tauri::is_dev()` stays true even in a release
# binary, so the window tries to load `build.devUrl` (a dev server that
# isn't running) instead of the embedded frontend - a blank/
# ERR_CONNECTION_REFUSED webview instead of the app. `cargo tauri dev`
# disables this default itself, so live-reload dev is unaffected.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"
flowcode-shared = { path = "shared" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
