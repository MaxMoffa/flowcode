[workspace]
members = ["installer", "shared", "remote-proto"]

[package]
name = "flowcode"
version = "0.18.0"
license = "Apache-2.0"
description = "Flowcode - cross-platform terminal"
authors = ["Massimo Moffa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# `cargo tauri build`/`cargo tauri dev` pass this automatically; our release
# builds (this repo's CI and local release process) invoke plain `cargo
# build --release` instead (see .github/workflows/release.yml), which
# bypasses that. Without it, `tauri::is_dev()` stays true even in a release
# binary, so the window tries to load `build.devUrl` (a dev server that
# isn't running) instead of the embedded frontend - a blank/
# ERR_CONNECTION_REFUSED webview instead of the app. `cargo tauri dev`
# disables this default itself, so live-reload dev is unaffected.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decoding the files of an agent view plugin package (view_plugins.rs).
base64 = "0.22"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"
flowcode-shared = { path = "shared" }
# Self-update (updater.rs): GitHub's releases API and the installer download.
ureq = "2"
sha2 = "0.10"
# Verifies the Ed25519 signature on a release's SHA256SUMS (updater.rs).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Live folder watching for the file explorer (watcher.rs). Renamed: `notify`
# is already this crate's own desktop-notification module.
fs-watch = { package = "notify", version = "8" }
# Registering a model in Mistral Vibe's config.toml (vibe.rs) without
# disturbing the rest of the user's file.
toml_edit = "0.25"

# Remote access (remote.rs): an iroh endpoint (QUIC with NAT traversal and
# relay fallback, authenticated end-to-end by the peers' keys) speaking the
# protocol in remote-proto. tokio matches the major version Tauri runs on.
iroh = "1.3"
iroh-tickets = "1"
futures-lite = "2"
flowcode-remote-proto = { path = "remote-proto" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
getrandom = "0.3"

# Local voice dictation (dictation/): whisper.cpp for the recognizing, cpal for
# the microphone. On Windows whisper.cpp must be built with clang-cl + Ninja
# (MSVC's build is ~20x slower at inference): `npm run tauri` sets that up
# (scripts/tauri.mjs); for plain cargo see scripts/cargo-env.ps1.
whisper-rs = "0.16"
cpal = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = "4.18.1"


[dev-dependencies]
# Paused clocks for the output batching tests (remote/stream.rs).
tokio = { version = "1", features = ["test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
