[package]
name = "flowcode-remote-proto"
version = "0.14.0"
license = "Apache-2.0"
edition = "2021"
description = "Wire protocol between Flowcode desktop and its phone app"

[lib]
name = "flowcode_remote_proto"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util"] }
# Deflate for large frames (already in the build through png).
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "macros"] }
