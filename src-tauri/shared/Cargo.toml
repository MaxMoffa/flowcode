[package]
name = "flowcode-shared"
version = "0.5.0"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "flowcode_shared"

[dependencies]
tauri = { version = "2" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "0.6"
