[package]
name = "flowcode-installer"
version = "0.3.0"
description = "Flowcode Setup"
authors = ["Massimo Moffa"]
edition = "2021"

[lib]
name = "flowcode_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# See src-tauri/Cargo.toml's identical block for why this is needed - same
# raw `cargo build --release` bypass applies to this binary too.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flowcode-shared = { path = "../shared" }

[target.'cfg(target_os = "windows")'.dependencies]
mslnk = "0.1"
winreg = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
