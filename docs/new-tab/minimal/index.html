<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Minimal</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        box-sizing: border-box;
        padding: 48px 32px 64px;
        overflow-y: auto;
        color: var(--fg, #888);
        font: 14px/1.5 var(--font-ui, sans-serif);
      }
      main {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 22px;
        font-weight: 600;
      }
      h2 {
        margin: 24px 0 8px;
        color: var(--fg-muted, #888);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      button {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:hover {
        background: var(--sidebar-hover, rgba(128, 128, 128, 0.15));
      }
      .path {
        overflow: hidden;
        color: var(--fg-muted, #888);
        font: 12px var(--font-mono, monospace);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        color: var(--fg-muted, #888);
      }
      #customize {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: auto;
        padding: 4px 10px;
        border: 1px solid var(--border, rgba(128, 128, 128, 0.3));
        color: var(--fg-muted, #888);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <section>
        <h2 id="favorites-title"></h2>
        <ul id="favorites"></ul>
      </section>
      <section>
        <h2 id="recents-title"></h2>
        <ul id="recents"></ul>
      </section>
      <section>
        <h2 id="shells-title"></h2>
        <ul id="shells"></ul>
      </section>
    </main>
    <button id="customize" type="button"></button>
    <script src="view.js"></script>
  </body>
</html>
