<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
        box-sizing: border-box;
        color: var(--fg, #888);
        font: 13.5px/1.5 var(--font-ui, sans-serif);
      }
      #log {
        flex: 1 1 auto;
        overflow-y: auto;
      }
      .msg {
        margin: 0 0 10px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user {
        color: var(--accent);
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--fg-muted);
        font-size: 12px;
      }
      #status {
        flex: 1 1 auto;
      }
      #compose {
        display: flex;
        gap: 8px;
      }
      textarea {
        flex: 1 1 auto;
        height: 56px;
        padding: 6px 8px;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-elevated);
        color: var(--fg);
        font: inherit;
      }
      button {
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--sidebar-hover);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      #send {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="bar">
      <span id="status"></span>
      <button id="cancel" type="button">Stop</button>
    </div>
    <div id="compose">
      <textarea id="text" placeholder="Scrivi all'agente…"></textarea>
      <button id="send" type="button">Invia</button>
    </div>
    <script src="view.js"></script>
  </body>
</html>
