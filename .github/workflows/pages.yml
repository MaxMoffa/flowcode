name: Pages

# Publishes the static site in site/ to GitHub Pages. Before uploading it,
# scripts/site-releases.mjs builds the changelog (site/changelog.html and one
# site/releases/<tag>.html per release) from the GitHub releases, so a new or
# edited release redeploys the site too. Only runs when the site, its
# generator or this workflow change - not on every push to master, that's
# ci.yml's job. `workflow_dispatch` redeploys by hand. One-time setup:
# Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/site-releases.mjs"
      - "scripts/site-templates/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a running deploy is left to finish rather than being
# cancelled half way, the next one just queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the changelog pages from the GitHub releases
        run: node scripts/site-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
