name: Pages

# Publishes the static landing page in site/ to GitHub Pages. Only runs when
# the page itself (or this workflow) changes - not on every push to master,
# that's ci.yml's job. `workflow_dispatch` redeploys by hand. One-time setup:
# Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a running deploy is left to finish rather than being
# cancelled half way, the next one just queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
