<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Flowcode release</title>
  <!-- Generic cover for releases without their own artwork: the app's warm
       near-black, its moss and amber glows, a dotted field and the frog
       resting on the ripples of the pond. 16:9, works cropped as a card and
       as a social image. -->
  <defs>
    <radialGradient id="glowA" cx="26%" cy="18%" r="62%">
      <stop offset="0" stop-color="#9db984" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9db984" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="86%" cy="30%" r="55%">
      <stop offset="0" stop-color="#c9975a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c9975a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="64%" r="48%">
      <stop offset="0" stop-color="#9db984" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#9db984" stop-opacity=".05"/>
      <stop offset="1" stop-color="#9db984" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotsFade" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.3" fill="#e8b880" fill-opacity=".2"/>
    </pattern>
    <mask id="dotsMask"><rect width="1600" height="900" fill="url(#dotsFade)"/></mask>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#9db984" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9db984" stop-opacity="1"/>
      <stop offset="1" stop-color="#9db984" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .95  0 0 0 0 .88  0 0 0 0 .78  0 0 0 .07 0"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0b0806"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <rect width="1600" height="900" fill="url(#dots)" mask="url(#dotsMask)"/>
  <rect width="1600" height="900" fill="url(#pool)"/>

  <!-- ripples -->
  <g fill="none" stroke="url(#ring)">
    <ellipse cx="800" cy="600" rx="230" ry="46" stroke-width="2.2" stroke-opacity=".75"/>
    <ellipse cx="800" cy="600" rx="380" ry="78" stroke-width="1.8" stroke-opacity=".5"/>
    <ellipse cx="800" cy="600" rx="560" ry="116" stroke-width="1.4" stroke-opacity=".32"/>
    <ellipse cx="800" cy="600" rx="780" ry="162" stroke-width="1.1" stroke-opacity=".18"/>
    <ellipse cx="800" cy="600" rx="1040" ry="216" stroke-width="1" stroke-opacity=".1"/>
  </g>

  <!-- the frog's glow and reflection -->
  <ellipse cx="800" cy="560" rx="190" ry="60" fill="#9db984" fill-opacity=".22" filter="url(#soft)"/>
  <g transform="translate(800 612) scale(.25 -.09) translate(-512 -610)" opacity=".18">
    <circle cx="340" cy="400" r="135" fill="#9db984"/>
    <circle cx="684" cy="400" r="135" fill="#9db984"/>
    <ellipse cx="512" cy="610" rx="360" ry="220" fill="#9db984"/>
  </g>

  <!-- the Flowcode frog (the app icon's shapes) -->
  <g transform="translate(800 470) scale(.25) translate(-512 -560)">
    <g fill="#a9c78f">
      <circle cx="340" cy="400" r="135"/>
      <circle cx="684" cy="400" r="135"/>
      <ellipse cx="512" cy="610" rx="360" ry="220"/>
    </g>
    <circle cx="340" cy="393" r="85" fill="#f4efe6"/>
    <circle cx="684" cy="393" r="85" fill="#f4efe6"/>
    <circle cx="362" cy="408" r="45" fill="#1d2a17"/>
    <circle cx="706" cy="408" r="45" fill="#1d2a17"/>
    <g fill="none" stroke="#1d2a17" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
      <path d="M396 575 L472 632 L396 689"/>
      <path d="M526 689 L636 689"/>
    </g>
  </g>

  <!-- a thin horizon and a few fireflies -->
  <rect x="0" y="899" width="1600" height="1" fill="#e8b880" fill-opacity=".12"/>
  <g fill="#d9f0b0">
    <circle cx="560" cy="330" r="2.4" fill-opacity=".7"/>
    <circle cx="1110" cy="282" r="2" fill-opacity=".55"/>
    <circle cx="1240" cy="420" r="1.6" fill-opacity=".4"/>
    <circle cx="420" cy="460" r="1.6" fill-opacity=".35"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)"/>
</svg>
