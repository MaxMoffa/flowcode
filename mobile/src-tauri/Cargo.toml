# Its own workspace: this crate can't join src-tauri's (different app, and
# Tauri's mobile tooling expects the project's Cargo.toml to be the root).
[workspace]

[package]
name = "flowcode-mobile"
version = "0.16.0"
license = "Apache-2.0"
description = "Flowcode Mobile - phone companion for Flowcode desktop"
authors = ["Massimo Moffa"]
edition = "2021"

[lib]
# Tauri mobile loads the app as a library; the unique name avoids the
# Windows lib/bin clash (see rust-lang/cargo#8519).
name = "flowcode_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Same reason as the desktop app: plain `cargo build --release` must embed
# the frontend instead of loading devUrl.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the lock; carries the Keystore plugin bytes over JSON.
base64 = "0.22"
flowcode-remote-proto = { path = "../../src-tauri/remote-proto" }
# Same versions as the desktop server (src-tauri/Cargo.lock).
iroh = "1.3"
iroh-tickets = "1"
futures-lite = "2"
# Self-update (updater.rs): same stack as the desktop updater (src-tauri/src/updater.rs).
ureq = "2"
sha2 = "0.10"
ed25519-dalek = { version = "3", default-features = false }
tokio = { version = "1", features = ["net", "sync", "time", "macros", "io-util", "rt", "rt-multi-thread"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-haptics = "2"

# Phones download this: optimize for size and drop symbols (an unstripped
# debug-info .so made the APK ~30 MB instead of ~20).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
