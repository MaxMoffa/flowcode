<!doctype html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quote di utilizzo · Flowcode</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d0b09;
      --terminal: #110e0b;
      --chrome: #18130f;
      --popover: #231b15;
      --ink: #efdfcd;
      --muted: #b5a18c;
      --faint: #a18e7a;
      --line: #3c3026;
      --split: #31261e;
      --track: #41352b;
      --hover: #30241b;
      --active: #302d20;
      --accent: #accc94;
      --opencode: #d3c5b5;
      --warning: #f1b378;
      --danger: #f09886;
      --shadow: 0 13px 24px rgb(0 0 0 / .28);
      --sans: "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", Consolas, monospace;
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --page: #f5eee3;
      --terminal: #fffaf1;
      --chrome: #f4eadd;
      --popover: #fffaf2;
      --ink: #352819;
      --muted: #6f5945;
      --faint: #79624c;
      --line: #d9c9b6;
      --split: #e6d9c9;
      --track: #e7daca;
      --hover: #f1e5d6;
      --active: #e8ecd9;
      --accent: #486735;
      --opencode: #5b544c;
      --warning: #844719;
      --danger: #a63325;
      --shadow: 0 13px 24px rgb(75 43 17 / .13);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 14px/1.45 var(--sans);
    }
    ::selection { background: var(--accent); color: var(--terminal); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    h1, h2, p { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    main { max-width: 1264px; margin: 0 auto; padding: 66px 44px 48px; }
    .board-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    h1 { font-size: 36px; font-weight: 650; letter-spacing: -.035em; line-height: 1.12; }
    .board-header p { margin-top: 9px; color: var(--muted); }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .segments { display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 9px; }
    .segments button, .theme {
      border: 0;
      border-radius: 6px;
      background: transparent;
      padding: 7px 10px;
      min-height: 35px;
      color: var(--muted);
      font-size: 13px;
    }
    .segments button[aria-pressed="true"] { background: var(--active); color: var(--ink); }
    .segments button:hover, .theme:hover { background: var(--hover); color: var(--ink); }
    .theme { border: 1px solid var(--line); border-radius: 9px; display: flex; align-items: center; gap: 7px; min-height: 43px; }
    .board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 30px; align-items: start; }
    .window { border: 1px solid var(--line); border-radius: 12px; background: var(--terminal); --provider: var(--opencode); }
    .window[data-provider="cline"] { --provider: var(--accent); }
    .toolbar {
      min-height: 49px;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 11px 11px 0 0;
      border-bottom: 1px solid var(--line);
      background: var(--chrome);
    }
    .terminal-tab { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 5px 9px; border-radius: 6px; background: var(--terminal); font-size: 12px; }
    .terminal-tab svg { color: var(--provider); }
    .terminal-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar-project { color: var(--faint); font-size: 11px; }
    .launcher {
      display: grid;
      place-items: center;
      position: relative;
      margin-left: auto;
      padding: 0 0 3px;
      inline-size: 34px;
      min-block-size: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--provider);
    }
    .launcher[aria-expanded="true"], .launcher:hover { background: var(--hover); }
    .mini-track { position: absolute; bottom: 3px; width: 17px; left: 50%; transform: translateX(-50%); height: 2px; background: var(--track); border-radius: 10px; overflow: hidden; }
    .mini-track span { display: block; height: 100%; background: var(--signal, var(--provider)); }
    .terminal-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 310px);
      min-height: 397px;
      padding: 12px;
      gap: 12px;
      align-items: start;
    }
    .terminal-copy {
      color: var(--faint);
      overflow: hidden;
      font: 12px/1.9 var(--mono);
      white-space: nowrap;
      padding: 12px 0 0 6px;
    }
    .terminal-copy .path { color: var(--accent); }
    .terminal-copy .cmd { color: var(--ink); }
    .terminal-copy .line-gap { margin-top: 14px; }
    .caret { display: inline-block; vertical-align: -.15em; width: .53em; height: 1em; background: var(--faint); }
    .popover {
      min-width: 0;
      padding: 15px 15px 12px;
      background: var(--popover);
      border-radius: 10px;
      box-shadow: var(--shadow);
      outline: 1px solid var(--split);
    }
    .popover[hidden] { display: none; }
    .provider-header { display: flex; align-items: center; gap: 10px; padding-bottom: 13px; }
    .provider-icon { display: grid; place-items: center; color: var(--provider); background: var(--hover); border-radius: 8px; width: 32px; height: 32px; }
    .provider-icon svg { width: 18px; height: 18px; }
    h2 { font-size: 15px; font-weight: 650; line-height: 1.3; }
    .provider-header p { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .metric { padding: 10px 0; border-top: 1px solid var(--split); }
    .metric-heading { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 13px; font-weight: 600; }
    .value { color: var(--signal, var(--provider)); font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .value span { color: var(--muted); font: 11px var(--sans); }
    .meter { height: 5px; margin-top: 8px; overflow: hidden; border-radius: 20px; background: var(--track); }
    .meter > span { display: block; height: 100%; border-radius: inherit; background: var(--signal, var(--provider)); }
    .meter-detail { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; margin-top: 6px; color: var(--muted); font-size: 11px; }
    [data-severity="warning"] { --signal: var(--warning); }
    [data-severity="limit"] { --signal: var(--danger); }
    .status { border-top: 1px solid var(--split); display: flex; gap: 9px; align-items: flex-start; padding: 14px 0 16px; min-height: 102px; }
    .status > svg { color: var(--warning); margin-top: 2px; }
    .status strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .status p { color: var(--muted); font-size: 12px; }
    .status code { color: var(--ink); font: 12px var(--mono); }
    .spend { border-top: 1px solid var(--split); color: var(--muted); font-size: 12px; }
    .spend summary { padding: 9px 0; cursor: pointer; }
    .spend summary:hover { color: var(--ink); }
    .spend dl { margin: 0; }
    .spend dl > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 3px 8px; padding: 5px 0; }
    .spend dd { margin: 0; color: var(--ink); font: 11px/1.55 var(--mono); }
    .external { display: inline-flex; gap: 6px; align-items: center; min-height: 32px; color: var(--accent); font-size: 12px; text-decoration: none; text-underline-offset: 3px; }
    .external svg { width: 12px; height: 12px; }
    .external:hover { text-decoration: underline; }
    .board-note { margin-top: 20px; color: var(--muted); font-size: 12px; }
    @media (max-width: 1100px) {
      main { padding-inline: 30px; }
      .board-header { align-items: flex-start; flex-direction: column; gap: 18px; }
      .terminal-body { grid-template-columns: minmax(0, 1fr) minmax(0, 285px); }
    }
    @media (max-width: 810px) {
      main { padding: 36px 22px; }
      .board { grid-template-columns: 1fr; gap: 18px; margin-top: 23px; }
      .terminal-body { min-height: 364px; grid-template-columns: minmax(0, 1fr) minmax(0, 310px); }
    }
    @media (max-width: 460px) {
      main { padding: 27px 14px; }
      h1 { font-size: 29px; }
      .terminal-body { display: flex; justify-content: flex-end; min-height: 235px; }
      .terminal-copy, .toolbar-project { display: none; }
      .popover { width: min(100%, 310px); }
    }
  </style>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6"/></symbol>
    <symbol id="opencode" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6v6H9z"/></symbol>
    <symbol id="cline" viewBox="0 0 24 24"><path d="M16 6a7 7 0 1 0 0 12m1-8 3 2-3 2"/></symbol>
    <symbol id="link" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9m8 0v6H5V5h6"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 0 1 10 4a8.5 8.5 0 1 0 10 10Z"/></symbol>
  </svg>
  <main>
    <header class="board-header">
      <div>
        <h1>Quote di utilizzo</h1>
        <p>OpenCode Go e ClinePass in Flowcode · Dati di esempio</p>
      </div>
      <div class="controls">
        <div class="segments" role="group" aria-label="Scenario">
          <button type="button" data-state="available" aria-pressed="true">Quote disponibili</button>
          <button type="button" data-state="limit" aria-pressed="false">Quota esaurita</button>
          <button type="button" data-state="unavailable" aria-pressed="false">Quote assenti</button>
        </div>
        <button class="theme" type="button" id="theme">
          <svg aria-hidden="true"><use href="#sun"/></svg><span>Tema chiaro</span>
        </button>
      </div>
    </header>
    <div class="board" id="board"></div>
    <p class="board-note">La barra rapida indica la finestra con la percentuale usata più alta.</p>
  </main>
  <script>
    const providers = [
      {
        id: "opencode",
        name: "OpenCode",
        account: "OpenCode Go · Personale",
        dashboard: "https://opencode.ai/console",
        used: [42, 78, 53],
        exhausted: [64, 100, 81],
        resets: ["Oggi 17:40", "Lun 23 nov 09:00", "1 dic 09:00"],
        unavailableTitle: "Quote Go non disponibili",
        unavailableDetail: "Il workspace non ha restituito quote Go. Puoi consultare budget e consumi locali.",
      },
      {
        id: "cline",
        name: "Cline",
        account: "ClinePass",
        dashboard: "https://app.cline.bot/dashboard/subscription?personal=true",
        used: [64, 29, 37],
        exhausted: [100, 56, 71],
        resets: ["Oggi 19:10", "Lun 23 nov 00:00", "1 dic 00:00"],
        unavailableTitle: "Rinnova l’accesso a Cline",
        unavailableDetail: "Esegui <code>cline auth</code> nel terminale, poi riapri la scheda per consultare le quote.",
      }
    ];
    const periods = ["5 ore", "Settimana", "Mese"];
    const board = document.querySelector("#board");
    const themeButton = document.querySelector("#theme");
    const stateButtons = document.querySelectorAll("[data-state]");
    let scenario = "available";

    const icon = (name) => `<svg aria-hidden="true"><use href="#${name}"/></svg>`;
    const severity = (percent) => percent >= 100 ? "limit" : percent >= 75 ? "warning" : "normal";

    function metric(label, used, reset) {
      return `<div class="metric" data-severity="${severity(used)}">
        <div class="metric-heading">
          <span>${label}</span><span class="value">${used}% <span>usato</span></span>
        </div>
        <div class="meter" role="meter" aria-label="Quota ${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${used}">
          <span style="width:${used}%"></span>
        </div>
        <div class="meter-detail"><span>${100 - used}% disponibile</span><span>Reset ${reset}</span></div>
      </div>`;
    }

    function preview(provider) {
      const values = scenario === "limit" ? provider.exhausted : provider.used;
      const top = Math.max(...values);
      const topPeriod = periods[values.indexOf(top)];
      const showQuota = scenario !== "unavailable";
      const buttonLabel = showQuota
        ? `${provider.name}, ${topPeriod}, ${top}% usato`
        : `Apri quote ${provider.name}`;
      const status = `<div class="status">${icon("info")}<div>
        <strong>${provider.unavailableTitle}</strong><p>${provider.unavailableDetail}</p>
      </div></div>`;
      const openCodeSpend = `<details class="spend">
        <summary>Budget Console e consumi locali</summary>
        <dl>
          <div><dt>Budget Console</dt><dd>$4,80 / $20,00</dd></div>
          <div><dt>Oggi</dt><dd>$0,42 · 84K token</dd></div>
          <div><dt>Ultimi 7 giorni</dt><dd>$1,90 · 312K token</dd></div>
          <div><dt>Ultimi 30 giorni</dt><dd>$4,80 · 1,1M token</dd></div>
        </dl>
      </details>`;
      return `<section class="window" data-provider="${provider.id}" aria-label="Anteprima ${provider.name}">
        <div class="toolbar">
          <div class="terminal-tab">${icon("terminal")}<span>${provider.id}</span></div>
          <span class="toolbar-project">Flowcode</span>
          <button class="launcher" type="button" aria-label="${buttonLabel}" aria-expanded="true" aria-controls="panel-${provider.id}" data-severity="${severity(top)}">
            ${icon(provider.id)}
            ${showQuota ? `<span class="mini-track" aria-hidden="true"><span style="width:${top}%"></span></span>` : ""}
          </button>
        </div>
        <div class="terminal-body">
          <div class="terminal-copy" aria-hidden="true">
            <div class="path">C:\\Work\\flowcode</div>
            <div><span class="cmd">PS &gt; ${provider.id}</span></div>
            <div class="line-gap">Sessione pronta</div>
            <div class="line-gap">&gt; <span class="caret"></span></div>
          </div>
          <div class="popover" id="panel-${provider.id}">
            <div class="provider-header">
              <span class="provider-icon">${icon(provider.id)}</span>
              <div><h2>${provider.name}</h2><p>${provider.account}</p></div>
            </div>
            ${showQuota ? periods.map((label, index) => metric(label, values[index], provider.resets[index])).join("") : status}
            ${provider.id === "opencode" ? openCodeSpend : ""}
            <a class="external" href="${provider.dashboard}" target="_blank" rel="noopener noreferrer">Apri pagina utilizzo ${icon("link")}</a>
          </div>
        </div>
      </section>`;
    }

    function render() {
      board.innerHTML = providers.map(preview).join("");
      board.querySelectorAll(".launcher").forEach((button) => {
        const panel = document.getElementById(button.getAttribute("aria-controls"));
        button.addEventListener("click", () => {
          panel.hidden = !panel.hidden;
          button.setAttribute("aria-expanded", String(!panel.hidden));
        });
      });
    }

    stateButtons.forEach((button) => button.addEventListener("click", () => {
      scenario = button.dataset.state;
      stateButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
      render();
    }));
    themeButton.addEventListener("click", () => {
      const light = document.documentElement.dataset.theme === "dark";
      document.documentElement.dataset.theme = light ? "light" : "dark";
      themeButton.querySelector("use").setAttribute("href", light ? "#moon" : "#sun");
      themeButton.querySelector("span").textContent = light ? "Tema scuro" : "Tema chiaro";
    });
    render();
  </script>
</body>
</html>
